# 커리어넷 Open API 응답 모양 확인(수동 실행). 결과는 Artifacts(careernet-probe)로 남고 키는 지워져 있다.
name: 커리어넷 API 확인
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/careernet-probe.mjs
        env:
          CAREERNET_API_KEY: ${{ secrets.CAREERNET_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: careernet-probe
          path: careernet-probe/
          retention-days: 3
