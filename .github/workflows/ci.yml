name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: 브라우저 전체 흐름 테스트(e2e)
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
          node scripts/serve-out.cjs out 5000 > /tmp/serve.log 2>&1 &
          for i in $(seq 30); do curl -s localhost:5000 >/dev/null && break; sleep 1; done
          BASE=http://localhost:5000 node scripts/e2e.cjs | tee /tmp/e2e.log
          if grep -q "check failed\|^errors: \[" /tmp/e2e.log; then echo "::error::e2e 실패"; exit 1; fi
          # 영어 모드 남은 한글(빈 기록·기록 있는 학생). 번역 빠진 문구가 있으면 실패
          node scripts/i18n-check.cjs | tee /tmp/i18n.log
          BASE=http://localhost:5000 node scripts/i18n-check-filled.cjs | tee -a /tmp/i18n.log
          if grep -E "^합계( 한글)? [1-9]" /tmp/i18n.log; then echo "::error::영어 모드에 번역 안 된 한글이 있어요"; exit 1; fi
