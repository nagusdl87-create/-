name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *" # 매일 04:17(한국) 급식·시간표·영상 갱신 후 재배포

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Firebase 설정(시크릿·변수)이 등록되기 전에는 건너뜁니다.
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 공식 채널 영상 목록 갱신 (YOUTUBE_API_KEY 없으면 건너뜀)
        run: node scripts/fetch-videos.mjs || echo "영상 갱신 실패 → 저장된 목록 사용"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 나이스 급식·개설 과목 갱신 (NEIS_API_KEY 없으면 건너뜀)
        run: node scripts/fetch-neis.mjs || echo "나이스 갱신 실패 → 저장된 자료 사용"
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      - run: npm run validate
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
