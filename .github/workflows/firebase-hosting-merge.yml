name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *" # 매일 04:17(한국) 급식·시간표·영상 갱신 후 재배포

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Firebase 설정(시크릿·변수)이 등록되기 전에는 건너뜁니다.
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 공식 채널 영상 목록 갱신 (YOUTUBE_API_KEY 없으면 건너뜀)
        run: node scripts/fetch-videos.mjs || echo "영상 갱신 실패 → 저장된 목록 사용"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 나이스 급식·개설 과목 갱신 (NEIS_API_KEY 없으면 건너뜀)
        run: node scripts/fetch-neis.mjs || echo "나이스 갱신 실패 → 저장된 자료 사용"
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      - run: npm run validate
      - name: 홈·메뉴 숫자 점검 (매일)
        run: npm run check:stats
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
      - run: npm run build
      - name: 브라우저 전체 흐름 테스트(e2e, 실패하면 경고만)
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
          npx -y serve@14.2.4 out -l 5000 > /tmp/serve.log 2>&1 &
          for i in $(seq 30); do curl -s localhost:5000 >/dev/null && break; sleep 1; done
          BASE=http://localhost:5000 node scripts/e2e.cjs | tee /tmp/e2e.log
          if grep -q "check failed\|^errors: \[" /tmp/e2e.log; then echo "::warning title=e2e::브라우저 테스트 실패 항목 있음"; exit 1; fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
